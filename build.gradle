
version = mod_version
group = mod_group_id

repositories {
    maven {
        name = "EnderIO"
        url = "https://maven.rover656.dev/releases"
        content { includeGroup "com.enderio" }
    }
    maven {
        name = "ChickenBones"
        url = "https://chickenbones.net/maven/"
        content {
            includeGroup "com.brandon3055.draconicevolution"
            includeGroup "com.brandon3055.brandonscore"
            includeGroup "io.codechicken"
            includeGroup "net.covers1624"
        }
    }

    maven {
        name = "BlameJared"
        url = "https://maven.blamejared.com/"
        content {
            includeGroup "malte0811"
            includeGroup "com.alexthw.eidolon_repraised"
        }
    }

    maven {
        name = "KosmX"
        url = "https://maven.kosmx.dev/"
        content {
            includeGroup "dev.kosmx.player-anim"
        }
    }

    maven {
        url "https://maven.sighs.cc/repository/maven-public/"
    }

    maven {
        name = "Iron's Maven"
        url = "https://code.redspace.io/releases"
    }

    maven {
        name = "Create"
        url = "https://maven.createmod.net"
    }
    maven {
        name = "Registrate"
        url = "https://maven.ithundxr.dev/snapshots"
    }

    maven {
        name = "Mekanism"
        url = "https://modmaven.dev"
        content {
            includeGroup "mekanism"
        }
    }
}

base {
    archivesName = "${mod_name}-neoforge-${minecraft_version}"
}

// mixinAgent 配置、neoForge 的 version/parchment 由根项目 build.gradle 的 subprojects 块统一提供
neoForge {
    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

apply from: project.file('gradle/ldlib2-uitest.gradle')

sourceSets.main.resources { srcDir 'src/generated/resources' }

// modAccessor 由根项目 build.gradle 的 subprojects 块统一配置
dependencies {
    implementation project(":ViScriptLib")
    jarJar project(path: ":ViScriptLib", configuration: "embeddedLibrary")

    // 可选兼容模组及其依赖。
    implementation "io.redspace:irons_spellbooks:${irons_spells_version}"
    runtimeOnly "io.redspace:irons_lib:${irons_lib_version}"
    runtimeOnly "dev.kosmx.player-anim:player-animation-lib-forge:${playeranimator_version}"
    runtimeOnly "software.bernie.geckolib:geckolib-neoforge-1.21.1:${geckolib_version}"
    //冰火传说
    compileOnly "curse.maven:iceandfire-ce-1040076:7722420"
    runtimeOnly "curse.maven:uranus-1010827:8008516"
    runtimeOnly "curse.maven:jupiter-1072905:7738312"
    //农夫乐事
    implementation "maven.modrinth:farmers-delight:${farmers_delight_version}"
    //机械动力
    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") {
        transitive = false
    }
    runtimeOnly "net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}"
    runtimeOnly "dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}"
    runtimeOnly "dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}"
    runtimeOnly "com.tterrag.registrate:Registrate:${registrate_version}"
    //新生魔艺
    implementation "curse.maven:ars-nouveau-401955:${ars_nouveau_file}"
    //无尽贪婪：重生
    implementation "curse.maven:re-avaritia-623969:${re_avaritia_file}"
    //合成拓展
    implementation "curse.maven:cucumber-272335:${cucumber_file}"
    //神秘农业
    compileOnly "curse.maven:mystical-agriculture-246640:${mystical_agriculture_file}"
    compileOnly "curse.maven:extended-crafting-268387:${extended_crafting_file}"
    //森罗物语：厨房
    implementation "maven.modrinth:kaleidoscope-cookery:${kaleidoscope_cookery_version}"
    //森罗物语：酒馆
    implementation "maven.modrinth:kaleidoscopetavern:${kaleidoscope_tavern_version}"
    //灾变：L_Ender's Cataclysm
    compileOnly "curse.maven:lendercataclysm-551586:${cataclysm_file}"
    runtimeOnly "curse.maven:lionfish-api-1001614:${lionfish_api_file}"
    //菌类感染：孢子
    implementation "curse.maven:fungal-infection-spore-678295:${fungal_infection_spore_file}"
    //诡厄巫法：Goety
    compileOnly "curse.maven:goety-586095:${goety_file}"
    //东方女仆：Touhou Little Maid
    compileOnly "curse.maven:touhou-little-maid-355044:${touhou_little_maid_file}"
    //工业先锋：Industrial Foregoing
    compileOnly "curse.maven:titanium-287342:${titanium_file}"
    compileOnly "curse.maven:industrial-foregoing-266515:${industrial_foregoing_file}"
    //通用机械：Mekanism
    compileOnly "mekanism:Mekanism:${mekanism_version}"
    //Alloy Smelter
    compileOnly "maven.modrinth:alloy-smelter:${alloy_smelter_version}"
    // Applied Energistics 2
    compileOnly "maven.modrinth:ae2:${ae2_version}"
//    runtimeOnly "maven.modrinth:guideme:${guideme_version}"
//    runtimeOnly "curse.maven:ae2-jei-integration-1074338:${ae2_jei_integration_file}"
    // [Let's Do] Farm & Charm
    implementation "maven.modrinth:lets-do-farm-charm:${farm_and_charm_version}"
    runtimeOnly "maven.modrinth:architectury-api:${architectury_version}"
    // [Let's Do] Bakery Farm & Charm
    implementation "curse.maven:lets-do-bakery-farm-charm-compat-1038130:${bakery_file}"
    // Extra Delight
    implementation "curse.maven:extradelight-842106:${extra_delight_file}"
    // Immersive Engineering
    implementation "curse.maven:immersive-engineering-231951:${immersive_engineering_file}"
    compileOnly "malte0811:DualCodecs:0.1.2"
    // eidolon
    implementation("com.alexthw.eidolon_repraised:eidolon_repraised-${minecraft_version}:${eidolon_repraised_version}") {
        transitive = false
